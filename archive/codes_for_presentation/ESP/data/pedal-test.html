<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            margin: 0;
        }

        .pedal-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 150px;
            height: 300px;
            background-color: #111;
            border-radius: 20px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .pedal {
            width: 200px;
            height: 150px;
            background: linear-gradient(to bottom, #444, #222);
            border-radius: 20px;
            position: absolute;
            bottom: 20px;
            transition: transform 0.1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .pedal::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.1) 0px,
                rgba(0, 0, 0, 0.5) 15px,
                rgba(255, 255, 255, 0.21) 30px
            );
            pointer-events: none;
        }

        .pedal.pressed {
            transform: translateY(20px);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="pedal-container">
        <div class="pedal" id="pedal">idk</div>
    </div>

    <script>
        const pedal = document.getElementById("pedal");

        function pressPedal() {
            pedal.classList.add("pressed");
        }

        function releasePedal() {
            pedal.classList.remove("pressed");
        }

        // Mouse Events
        pedal.addEventListener("mousedown", pressPedal);
        pedal.addEventListener("mouseup", releasePedal);
        pedal.addEventListener("mouseleave", releasePedal);

        // Touch Events for Mobile
        pedal.addEventListener("touchstart", pressPedal);
        pedal.addEventListener("touchend", releasePedal);
    </script>

</body>
</html>
