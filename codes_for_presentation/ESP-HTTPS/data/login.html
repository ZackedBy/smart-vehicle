<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.ico">
    <title>Login</title>
    <style type="text/css">
        html,body {
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            height: 100%;
            gap: 50px;
        }
        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .error-message {
            color: red;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }
        img {
            width: 400px;
            height: 300px;
        }
        input {
            /* border: 2px solid #BBA56B ; */
            border-radius: 10px;
        }
        button{
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            color: white;
            background: #BBA56B;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        button:hover {
            background: #8a7848;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        @media (orientation: landscape) and (max-width: 1024px) {
            .container {
                flex-direction: row;
            }
            /* img {
                height: 100%;
            } */
        }
    </style>
</head>
<body style="background-color: rgb(30, 24, 18); color: white;">
    <div class="container center">
        <img src="assets/logo.jpg" loading="lazy">
        <form class="center" onsubmit="return handleLogin(event)">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <div id="error-message" class="error-message">Invalid username or password. Please try again.</div>
        </form>
    </div>

    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script> -->

    <script>
        const errorMessage = document.getElementById("error-message");

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // const hashedPassword = CryptoJS.SHA256(password).toString();

            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });

            if (response.status == 302) {
                window.location.href = "/index";
            } else if (response.status == 401) {
               errorMessage.style.display = "block";
            } else {
                alert("An error occurred. Please try again later.");
            }
        }

        document.getElementById("username").addEventListener("input", function() {
            errorMessage.style.display = "none";
        });

        document.getElementById("password").addEventListener("input", function() {
            errorMessage.style.display = "none";
        });
    </script>
</body>
</html>
