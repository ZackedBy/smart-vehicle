<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body style="background-color: rgb(30, 24, 18); color: white;">
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <img src="assets/JIT-logo2.jpg" style="width: 200px; height: 200px;">
            <form id="loginForm" onsubmit="checkCredentials(event)" action="" style="display: flex; flex-direction: column; align-items: center;">
                <label for="name">Username:</label>
                <input type="text" id="name" name="name" placeholder="Enter your username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Password" required>

                <button type="submit"">Login</button>
            </form>
        </div>
    </div>


    <script>
        const loginForm = document.getElementById("loginForm");
        async function checkCredentials(event) {
            event.preventDefault(); // Prevent form from reloading page

            const username = document.getElementById("name").value;
            const password = document.getElementById("password").value;

            // Send credentials to ESP8266
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });

            if (response.status === 200) {
                sessionStorage.setItem("auth", "true"); // Store authentication state
                window.location.href = "/index"; // Redirect to index.html
            } else {
                alert("Invalid credentials. Please try again.");
            }
        }
    </script>
</body>
</html>
