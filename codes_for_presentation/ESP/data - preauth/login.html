<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div>
        <img src="assets/JIT-logo2.jpg">
    </div>
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        <form id="loginForm" action="" style="display: flex; flex-direction: column;">
            <label for="name">Username:</label>
            <input type="text" id="name" name="name" placeholder="Enter your username" required>

            <label for="password">Password:</label>
            <input type="text" id="password" name="password" placeholder="Password" required>

            <button type="submit" onclick="hello()">Login</button>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault(); // Prevent form from reloading page

            const username = document.getElementById("name").value;
            const password = document.getElementById("password").value;

            // Send credentials to ESP8266
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });

            if (response.status === 200) {
                sessionStorage.setItem("auth", "true"); // Store authentication state
                window.location.href = "/"; // Redirect to index.html
            } else {
                alert("Invalid credentials. Please try again.");
            }
        });
    </script>
</body>
</html>
