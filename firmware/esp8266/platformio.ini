; ESP8266 web UI. Change board to nodemcuv2 or d1_mini to match the module on the bench.
; Flash the chip, then the filesystem:
;   pio run -d firmware/esp8266 -t upload
;   pio run -d firmware/esp8266 -t uploadfs
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 9600
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
lib_extra_dirs = ${PROJECT_DIR}/../lib
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -Wall
    -Wno-unused-parameter
    -std=gnu++17
