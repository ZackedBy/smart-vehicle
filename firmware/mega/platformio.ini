; Arduino Mega 2560. Upload with: pio run -d firmware/mega -t upload
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
lib_extra_dirs = ${PROJECT_DIR}/../lib
lib_deps =
    https://github.com/garmin/LIDARLite_Arduino_Library.git
    adafruit/Adafruit TCS34725@^1.4.4
    adafruit/Adafruit BusIO@^1.17.0
    arduino-libraries/LiquidCrystal@^1.0.7
build_flags =
    -Wall
    -Wno-unused-parameter
    -std=gnu++17
